name: Search Growth OS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Existing Phase 1 tests
        run: npm run test:phase1
      - name: Existing validation
        run: npm run validate
      - name: Existing regression guardrails
        run: npm run regressions
      - name: Adapter and Audit Run tests
        run: npm run test:adapters
      - name: Bounded crawler tests
        run: npm run test:crawler
      - name: Security boundary tests
        run: npm run test:security
      - name: Full offline test suite
        run: npm test
